<svg viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="USHomeBuy.com — Your Instant Rebuyer">
  <defs>
    <pattern id="stripesDiag" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-73)">
      <rect width="22" height="22" fill="#ffffff"/>
      <rect width="11" height="22" fill="#B7333F"/>
    </pattern>
    <pattern id="stripesHoriz" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#ffffff"/>
      <rect width="22" height="11" fill="#B7333F"/>
    </pattern>
    <polygon id="star" points="0,-11 2.59,-3.4 10.46,-3.4 4.19,1.3 6.47,8.9 0,4.2 -6.47,8.9 -4.19,1.3 -10.46,-3.4 -2.59,-3.4" fill="#ffffff"/>
  </defs>

  <!-- Icon -->
  <g>
    <!-- chimney, stepped: a shorter wide base with a taller narrow left riser -->
    <rect x="136" y="70" width="30" height="75" fill="#17264D"/>
    <rect x="136" y="45" width="16" height="30" fill="#17264D"/>

    <!-- roof -->
    <polygon points="210,25 90,135 210,135" fill="#17264D"/>
    <polygon points="210,25 330,135 210,135" fill="url(#stripesDiag)"/>

    <!-- body -->
    <rect x="90" y="135" width="120" height="115" fill="#17264D"/>
    <rect x="210" y="135" width="120" height="115" fill="url(#stripesHoriz)"/>

    <!-- door / base leg -->
    <rect x="138" y="250" width="48" height="48" fill="#17264D"/>

    <!-- stars, diamond formation -->
    <use href="#star" transform="translate(150,66)"/>
    <use href="#star" transform="translate(126,90)"/>
    <use href="#star" transform="translate(174,90)"/>
    <use href="#star" transform="translate(150,114)"/>
  </g>

  <!-- Wordmark -->
  <text x="392" y="185" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="78">
    <tspan fill="#17264D">ushomebuy</tspan><tspan fill="#B7333F">.com</tspan>
  </text>
  <text x="394" y="228" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="26" letter-spacing="5" fill="#17264D">YOUR INSTANT REBUYER</text>
</svg>
